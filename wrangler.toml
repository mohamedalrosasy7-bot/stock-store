name = "stock-store"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# Database binding: run `npx wrangler d1 create stock-store-db` and put the id below.

[[d1_databases]]
binding = "DB"
database_name = "stock-store-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
# Public, safe to commit. Secrets live in Cloudflare dashboard / .dev.vars.
CLOUDINARY_CLOUD_NAME = "mpbvtc5j"
